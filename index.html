<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dice Roll</title>
  <meta name="description" content="Roll 3D dice: D4, D6, D8, D10, D12, D20 and percentile. Shake your phone or tap Roll.">
  <meta name="theme-color" content="#151a27">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="toolbar">
      <button id="theme-btn" type="button" class="icon-btn" aria-label="Duck theme" aria-pressed="false" title="Duck theme">🦆</button>
      <button id="sound-btn" type="button" class="icon-btn" title="Sound">🔊</button>
    </div>
    <h1>Dice Roll</h1>
    <nav id="picker" aria-label="Choose a die"></nav>
  </header>

  <main id="stage" aria-label="Die. Click to roll.">
    <div id="result" aria-live="polite"></div>
  </main>

  <footer>
    <ol id="history" aria-label="Recent rolls"></ol>
    <div class="actions">
      <button id="enable-motion" type="button" class="secondary" hidden>Enable shake</button>
      <button id="roll" type="button">Roll</button>
    </div>
    <p id="hint" hidden>Shake your phone to roll</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
